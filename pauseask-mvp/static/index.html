<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EdySync</title>
<style>
body{font-family:Calibri,Arial,sans-serif;margin:0;background:#f6f4ee;color:#0b1b2b}
header{background:#0b1b2b;color:#fff;padding:12px 24px;font-size:22px;font-weight:bold}header b{color:#f5b342}
main{display:flex;gap:16px;padding:16px;flex-wrap:wrap}
.left{flex:2;min-width:300px}.right{flex:1;min-width:300px}
video{width:100%;background:#000;border-radius:8px}
.note{font-size:13px;color:#5b6670;margin-top:6px}
#log{background:#fff;border-radius:8px;padding:12px;height:360px;overflow:auto}
.msg{margin:8px 0;white-space:pre-wrap}.user{font-weight:bold}
.src{margin:4px 4px 0 0;padding:3px 8px;border:1px solid #0e8f84;color:#0e8f84;background:#fff;border-radius:12px;cursor:pointer}
.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1;padding:8px}
button.ask{background:#0e8f84;color:#fff;border:0;border-radius:6px;padding:8px 16px;cursor:pointer}
</style></head><body>
<header>Pause<b>Ask</b></header>
<main>
 <div class="left">
  <video id="video" src="lecture.mp4" controls></video>
  <div class="note">Video time (seconds): <input id="t" type="number" min="0" value="0" style="width:80px">
   It updates while the video plays. No video file yet? Type a time here to test.</div>
 </div>
 <div class="right">
  <div id="log"><div class="msg">Pause the video, then ask a question about what you have watched.</div></div>
  <div class="row"><input id="q" type="text" maxlength="500" placeholder="Ask a question..."><button class="ask" id="go">Ask</button></div>
 </div>
</main>
<script>
const video = document.getElementById("video"), tInput = document.getElementById("t"), log = document.getElementById("log"), q = document.getElementById("q");
const history = [];
video.addEventListener("timeupdate", () => { tInput.value = Math.floor(video.currentTime); });
function add(cls, text) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
async function ask() {
  const question = q.value.trim(); if (!question) return; q.value = "";
  add("user", "You: " + question); const reply = add("bot", "Thinking...");
  try {
    const res = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, current_time: Number(tInput.value) || 0, history: history.slice(-6) }) });
    if (!res.ok) throw new Error(res.status === 502 ? "The AI service is unavailable. Please try again." : "Something went wrong (" + res.status + ").");
    const data = await res.json();
    reply.textContent = data.answer;
    (data.sources || []).forEach(s => {
      const b = document.createElement("button"); b.className = "src"; b.textContent = s.label;
      b.onclick = () => { if (s.seek != null) { video.currentTime = s.seek; } };
      reply.appendChild(document.createElement("br")); reply.appendChild(b);
    });
    history.push({ role: "user", text: question }, { role: "assistant", text: data.answer });
  } catch (e) { reply.textContent = e.message; }
}
document.getElementById("go").onclick = ask;
q.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script></body></html>
